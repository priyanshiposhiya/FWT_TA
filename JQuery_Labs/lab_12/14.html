<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Input Color Change</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
        crossorigin="anonymous"></script>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container{
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            width: 350px;
        }

        h2{
            text-align: center;
            margin-bottom: 20px;
        }

        label{
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-size: 18px;
        }

        input{
            width: 100%;
            padding: 10px;
            border: 1px solid gray;
            border-radius: 5px;
            font-size: 16px;
        }

    </style>
</head>

<body>

    <div class="container">

        <h2>Input Focus Demo</h2>

        <label>1</label>
        <input type="text">

        <label>2</label>
        <input type="text">

        <label>3</label>
        <input type="text">

        <label>4</label>
        <input type="text">

    </div>

    <script>

        $(document).ready(function(){

            $('input').focus(function(){

                $('input').css({
                    backgroundColor : "red"
                });

            });

            $('input').blur(function(){

                $('input').css({
                    backgroundColor : "white"
                });

            });

        });

    </script>

</body>
</html>
