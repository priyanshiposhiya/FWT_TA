<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Color Change</title>

    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f4f4f4;
        }

        .container{
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
            width: 300px;
        }

        label{
            font-size: 18px;
            font-weight: bold;
        }

        input{
            width: 100%;
            padding: 10px;
            margin: 10px 0 20px;
            border: 2px solid gray;
            border-radius: 5px;
            font-size: 16px;
        }

        button{
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background-color: purple;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover{
            background-color: darkmagenta;
        }

    </style>

</head>

<body>

    <div class="container">

        <label>1</label>
        <input type="text">

        <label>2</label>
        <input type="text">

        <label>3</label>
        <input type="text">

        <label>4</label>
        <input type="text">

        <button>Click</button>

    </div>

    <script>

        $(document).ready(function () {

            $('button').click(function () {

                $('input').css({
                    backgroundColor: "red",
                    color: "white"
                });

            });

        });

    </script>

</body>

</html>
