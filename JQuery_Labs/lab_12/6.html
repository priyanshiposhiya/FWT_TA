<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Items in Table</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
        crossorigin="anonymous"></script>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container{
            width: 500px;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            text-align: center;
        }

        h2{
            margin-bottom: 20px;
        }

        button{
            padding: 10px 20px;
            border: none;
            background-color: #4CAF50;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        button:hover{
            background-color: #388E3C;
        }

        table{
            width: 100%;
            border-collapse: collapse;
        }

        th{
            background-color: #4CAF50;
            color: white;
            padding: 10px;
        }

        td{
            padding: 10px;
            text-align: center;
        }

        tr:nth-child(even){
            background-color: #f9f9f9;
        }

    </style>

</head>

<body>

    <div class="container">

        <h2>Add Data in Table</h2>

        <button id="btn">Add</button>

        <table border="1">

            <thead>
                <tr>
                    <th>Name</th>
                    <th>Roll No.</th>
                </tr>
            </thead>

            <tbody>

            </tbody>

        </table>

    </div>

    <script>

        $(document).ready(function () {

            $('#btn').click(function () {

                $('tbody').append(
                    '<tr><td>Hello World</td><td>1</td></tr>'
                );

            });

        });

    </script>

</body>

</html>
