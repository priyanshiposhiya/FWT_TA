<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clicked Hide Elements</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
        crossorigin="anonymous"></script>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            background-color: #f4f4f4;
            padding: 40px;
            text-align: center;
        }

        .container{
            width: 400px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        p{
            background-color: #e3f2fd;
            padding: 12px;
            margin: 10px 0;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
        }

        label{
            display: block;
            margin-top: 20px;
            font-size: 18px;
        }

        input{
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: 1px solid gray;
            border-radius: 5px;
            font-size: 16px;
        }

        button{
            margin-top: 20px;
            padding: 10px 20px;
            border: none;
            background-color: blue;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover{
            background-color: darkblue;
        }

    </style>
</head>

<body>

        <p>Hello World!!!!</p>
        <p>Hello Gyzz!!!</p>
        <p>Darshan University</p>

        <label>1</label>

        <input type="text" placeholder="Enter Something">

        <button>Click</button>

    <script>

        $(document).ready(function(){

            $('body *').click(function(){

                $(this).hide();

            });

        });

    </script>

</body>
</html>
