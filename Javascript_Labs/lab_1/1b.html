<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moving Box</title>
<style>

div{
    width:100px;
    height:100px;
    background:red;
    position:relative;

    animation-name:movebox;
    animation-duration:5s;
}

@keyframes movebox{

    0%{
        left:0px;
        top:0px;
    }

    25%{
        left:500px;
        top:0px;
    }

    50%{
        left:500px;
        top:500px;
    }

    75%{
        left:0px;
        top:500px;
    }

    100%{
        left:0px;
        top:0px;
    }
}

</style>
</head>

<body>

<div></div>

</body>
</html>
