<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Changing Background</title>
<style>

div{
    width:150px;
    height:150px;
    background:red;

    animation-name:colorchange;
    animation-duration:1s;

    /* animation : colorchange 1s infinite */
} 

@keyframes colorchange{
    from{
        background:red;
    }

    to{
        background:yellow;
    }
}

</style>
</head>

<body>

<div></div>

</body>
</html>
