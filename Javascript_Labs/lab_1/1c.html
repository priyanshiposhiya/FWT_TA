<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delay Animation</title>
<style>

div{
    width:100px;
    height:100px;
    background:red;
    position:relative;

    animation-name:movebox;
    animation-duration:5s;
    animation-delay:2s;
}

@keyframes movebox{

    from{
        left:0px;
    }

    to{
        left:300px;
    }
}

</style>
</head>

<body>

<div></div>

</body>
</html>
