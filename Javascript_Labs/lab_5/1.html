<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maximum Number</title>
</head>

<body>
    <script>
        n = parseInt(prompt("Enter the size of array : "));

        a = [];

        for (i = 0; i < n; i++) {
            a[i] = parseInt(prompt("Enter the " + (i + 1) + " element : "));
        }

        max = a[0]

        for (i = 0; i < n; i++) {
            if (max < a[i]) {
                max = a[i]
            }
        }
        document.write("Maximum number is : " + max)

    </script>
</body>

</html>
