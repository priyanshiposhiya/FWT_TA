<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validation Form</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 40px;
        }

        .form-container {
            background: #fff;
            padding: 40px 50px;
            max-width: 650px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }

        .form-title {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }

        input:not([type="radio"]),
        select,
        textarea,
        button {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            margin-bottom: 20px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 15px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #4CAF50;
            box-shadow: 0 0 5px rgba(76, 175, 80, 0.3);
        }

        .gender-group {
            display: flex;
            gap: 20px;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .gender-group label {
            font-weight: normal;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }

        button:hover {
            background-color: #45a049;
        }
    </style>
</head>

<body>

    <div class="form-container">

        <h2 class="form-title">User Registration Form</h2>

        <form novalidate onsubmit="submitValidate(event)">

            <label for="fname">Full Name:</label>
            <input type="text" id="fname" name="fullname" placeholder="Enter full name">

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter email">

            <label for="enroll">Enrollment Number:</label>
            <input type="text" id="enroll" name="enroll" placeholder="Enter enrollment number">

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" placeholder="e.g. 9876543210">

            <label>Gender:</label>

            <div class="gender-group">
                <label>
                    <input type="radio" name="gender" value="Male">
                    Male
                </label>

                <label>
                    <input type="radio" name="gender" value="Female">
                    Female
                </label>

                <label>
                    <input type="radio" name="gender" value="Other">
                    Other
                </label>
            </div>

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob">

            <label for="country">Country:</label>

            <select id="country" name="country">
                <option value="" disabled>Select Country</option>
                <option>India</option>
                <option>USA</option>
                <option>UK</option>
                <option>Canada</option>
                <option>Australia</option>
            </select>

            <label for="address">Address:</label>

            <textarea id="address" name="address" rows="4"
                placeholder="Enter full address"></textarea>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password">

            <label for="confirm">Confirm Password:</label>
            <input type="password" id="confirmpass" name="confirm">

            <button type="submit">Register</button>

        </form>
    </div>

    <script>

        function submitValidate(e) {

            e.preventDefault();

            let name = document.getElementById("fname").value;
            let email = document.getElementById("email").value;
            let phone = document.getElementById("phone").value;
            let password = document.getElementById("password").value;
            let confirmPass = document.getElementById("confirmpass").value;
            let enroll = document.getElementById("enroll").value;

            let namePattern = /^[A-Za-z\s]+$/;
            let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            let phonePattern = /^[0-9]{10}$/;
            let passwordPattern = /^(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,12}$/;
            let enrollPattern = /^[0-9]{11}$/;

            if (name.length < 3 || !namePattern.test(name)) {
                alert("Enter valid full name.");
                return;
            }

            if (!emailPattern.test(email)) {
                alert("Enter valid email.");
                return;
            }

            if (!phonePattern.test(phone)) {
                alert("Enter valid phone number.");
                return;
            }

            if (!enrollPattern.test(enroll)) {
                alert("Enrollment number must be 11 digits.");
                return;
            }

            if (!passwordPattern.test(password)) {
                alert("Password must contain 8-12 characters, one number and one special character.");
                return;
            }

            if (password !== confirmPass) {
                alert("Passwords do not match.");
                return;
            }

            alert("Form submitted successfully!");

        }

    </script>

</body>

</html>
