<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Occurrence of a</title>
</head>

<body>

    <script>

        str = prompt("Enter a word:");

        first = str.indexOf("a");

        last = str.lastIndexOf("a");

        middle = str.substring(first + 1, last);

        document.write("First occurrence : " + (first + 1)) 
        document.write("</br>")
        document.write("Last occurrence : " + (last + 1))
        document.write("</br>")
        document.write("String between : " + middle);

    </script>

</body>

</html>
