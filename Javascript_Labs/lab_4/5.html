<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digit Power</title>
</head>

<body>

    <script>

        num = parseInt(prompt("Enter 2-digit number:"));

        first = parseInt(num / 10);

        second = num % 10;

        result = 1;

        for (i = 1; i <= second; i++) {
            result = result * first;
        }

        document.write("Result : " + result);

    </script>

</body>

</html>
