<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prime Numbers</title>
</head>

<body>

    <script>

        start = parseInt(prompt("Enter starting number:"));
        end = parseInt(prompt("Enter ending number:"));

        result = "";

        for (num = start; num <= end; num++) {
            prime = true;

            if (num <= 1) {
                prime = false;
            }

            for (i = 2; i < num; i++) {
                if (num % i == 0) {
                    prime = false;
                    break;
                }
            }

            if (prime) {
                result = result + num + " ";
            }
        }

        document.write("Prime Numbers : " + result);

    </script>

</body>

</html>
