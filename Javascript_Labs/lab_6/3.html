<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0 ">
    <title>Students Array Demo</title>
</head>

<body>

    <script>

        students = ["Amit", "Riya", "Priya", "Rahul", "Neha"];

        document.write("<h2>Student Names</h2>");

        for (i = 0; i < students.length; i++) {
            document.write(students[i] + "<br>");
        }

    </script>

</body>

</html>
