<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Array Demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous" />
</head>

<body>
    <script>
        faculty = [
            {
                name: "Arjun ",
                age: 40,
                department: "CSE",
                experience: 23,
                qualification: "M.Tech",
            },
            {
                name: "Paras ",
                age: 35,
                department: "Civil",
                experience: 20,
                qualification: "Ph.D",
            },
            {
                name: "Swati",
                age: 36,
                department: "BBA",
                experience: 15,
                qualification: "MBA",
            },
            {
                name: "Dhavink",
                age: 40,
                department: "BCA",
                experience: 16,
                qualification: "MCA",
            },
            {
                name: "Dixita",
                age: 32,
                department: "MBA",
                experience: 21,
                qualification: "Ph.D",
            },
        ];
        document.write("<table class='table'>");
        document.write("<thead>");
        document.write("<tr>");
        document.write("<th scope='col'>No.</th>");
        document.write("<th scope='col'>Name</th>");
        document.write("<th scope='col'>Age</th>");
        document.write("<th scope='col'>Department</th>");
        document.write("<th scope='col'>Experience</th>");
        document.write("<th scope='col'>Qualification</th>");
        document.write("</tr>");
        document.write("</thead>");
        document.write("<tbody>");
        for (i = 0; i < faculty.length; i++) {
            document.write("<tr>");
            document.write("<th scope='row'>" + (i + 1) + "</th>");
            document.write("<td>" + faculty[i].name + "</td>");
            document.write("<td>" + faculty[i].age + "</td>");
            document.write("<td>" + faculty[i].department + "</td>");
            document.write("<td>" + faculty[i].experience + "</td>");
            document.write("<td>" + faculty[i].qualification + "</td>");
            document.write("</tr>");
        }
        document.write("</tbody>");
        document.write("</table>");
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous">
    </script>
</body>

</html>
