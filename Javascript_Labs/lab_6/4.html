<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0 ">
    <title>Products Array Demo</title>
</head>

<body>

    <script>

        products = ["Laptop", "Mobile", "Keyboard", "Mouse", "Printer"];

        document.write("<h2>Product List</h2>");

        for (i = 0; i < products.length; i++) {
            document.write((i + 1) + ". " + products[i] + "<br>");
        }

    </script>

</body>

</html>
