<!DOCTYPE html>
<html>
<head>
    <title>Keyboard Event Task</title>

    <style>

        body{
            text-align: center;
            margin-top: 100px;
            font-family: Arial;
            transition: 0.5s;
        }

        input{
            padding: 10px;
            width: 300px;
            font-size: 20px;
        }

    </style>
</head>
<body>

    <h1>Keyboard Events Demo</h1>

    <input type="text"
        onkeydown="checkKey(event)"
        onkeyup="changeBackground()"
        placeholder="Press Any Key">

    <h2 id="result"></h2>

    <script>

        function checkKey(event){

            let key = event.key;

            document.getElementById("result").innerHTML =
            "Key Pressed : " + key;

            if(
                key == "a" ||
                key == "e" ||
                key == "i" ||
                key == "o" ||
                key == "u"
            ){

                alert("Vowel Key Pressed");
            }
        }

        function changeBackground(){
            
            document.body.style.backgroundColor = "lightblue";
        }

    </script>

</body>
</html>
