<!DOCTYPE html>
<html>
<head>
    <title>Mouse Events Task</title>

    <style>

        body{
            text-align: center;
            font-family: Arial;
            transition: 0.5s;
        }

        h1{
            margin-top: 50px;
        }

        button{
            padding: 10px 20px;
            margin: 10px;
            font-size: 18px;
        }

    </style>
</head>
<body>

    <h1 id="heading"
        onmouseover="yellowColor()"
        onmouseout="blackColor()">

        Mouse Events Demo

    </h1>

    <button onclick="showDateTime()">Find Time</button>

    <button onclick="redBg()">Red</button>

    <button onclick="greenBg()">Green</button>

    <h2 id="result"></h2>

    <script>

        function yellowColor(){
            document.getElementById("heading").style.color = "yellow";
        }

        function blackColor(){
            document.getElementById("heading").style.color = "black";
        }

        function showDateTime(){

            document.getElementById("result").innerHTML = Date();
        }

        function redBg(){
            document.body.style.backgroundColor = "red";
        }

        function greenBg(){
            document.body.style.backgroundColor = "green";
        }

    </script>

</body>
