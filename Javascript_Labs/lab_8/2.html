<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mouse Events</title>

    <style>
        #box{
            width: 300px;
            height: 150px;
            background-color: lightgray;
            text-align: center;
            line-height: 150px;
            margin: 100px auto;
            font-size: 22px;
        }

        h2{
            text-align: center;
        }
    </style>
</head>
<body>

    <h2 id="result">Perform Mouse Event</h2>

    <div id="box"
        onclick="show('Click Event Fired')"
        ondblclick="show('Double Click Event Fired')"
        onmouseover="show('Mouse Over Event Fired')"
        onmouseout="show('Mouse Out Event Fired')">

        Mouse Events Area

    </div>

    <script>

        function show(message){
            document.getElementById("result").innerHTML = message;
        }

    </script>

</body>
</html>
