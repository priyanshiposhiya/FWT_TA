<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For...of Loop Demo</title>
</head>
<body>
    <script>
        s="Priyanshi"
        for(char of s){
            document.write(char)
        }
        document.write("</br>")

        a=[1,2,3,4,5]
        for(arr of a){
            document.write(arr)
        }
    </script>
</body>
</html>
