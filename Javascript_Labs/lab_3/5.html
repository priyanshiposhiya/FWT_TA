<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Palindrome Checker</title>
</head>

<body>
    <script>
        num = parseInt(prompt("Enter the number  : "));
        rev = 0;
        temp = num;
        while (num != 0) {
            rem = num % 10;
            num = parseInt(num / 10);
            rev = rev * 10 + rem;
        }
        if (temp == rev) {
            document.write("Number is Palindrome")
        }
        else {
            document.write("Number is not Palindrome")
        }
    </script>
</body>

</html>
