<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime Number Checker</title>
</head>

<body>
    <script>
        num = parseInt(prompt("Enter the number  : "))
        count = 0
        for (i = 1; i <= num; i++) {
            if (num % i == 0) {
                count++
            }
        }
        if (count == 2) {
            document.write("Number is prime")
        }
        else {
            document.write("Number is not prime")
        }
    </script>
</body>

</html>
